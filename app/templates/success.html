<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Created - TimeVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1628] min-h-screen font-sans">
  <nav class="bg-[#0e1628] border-b border-white/5 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 no-underline">
        <span class="flex items-center justify-center w-8 h-8 bg-indigo-600 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5l-9-4z"/>
          </svg>
        </span>
        <span class="text-white font-semibold tracking-tight text-sm">TimeVault</span>
      </a>
      <div class="flex items-center gap-1 text-sm">
        <a href="/" class="text-white/55 px-4 py-1.5 rounded-md font-medium hover:text-white hover:bg-white/10 transition-colors no-underline">New</a>
        <a href="/my-secrets" class="text-white/90 px-4 py-1.5 rounded-md font-medium hover:bg-white/10 transition-colors no-underline">History</a>
        <a href="/logout" class="text-red-300 px-4 py-1.5 rounded-md font-medium hover:bg-red-400/10 transition-colors no-underline">Log out</a>
      </div>
    </div>
  </nav>

  <div class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h1 class="text-2xl font-bold text-gray-900">Secret Created!</h1>
      <p class="text-sm text-gray-500 mt-1">Share this link with anyone you want to give access to your secret.</p>

      <div class="mt-6 rounded-2xl border border-green-200 bg-green-50 p-5">
        <div class="font-mono text-sm text-indigo-700 break-all" id="secret-link">{{ secret_url }}</div>
        <button id="copy-btn" class="mt-4 px-4 py-2 rounded-xl border border-gray-200 bg-white text-gray-700 text-sm font-medium hover:bg-gray-50 transition">Copy link</button>
      </div>

      <a href="/" class="inline-flex mt-6 text-sm text-indigo-600 font-medium no-underline hover:underline">← Create another secret</a>
    </div>
  </div>

  <script>
    var btn = document.getElementById('copy-btn');
    btn.addEventListener('click', function() {
      navigator.clipboard.writeText('{{ secret_url }}').then(function() {
        btn.textContent = 'Copied!';
      });
    });
  </script>
</body>
</html>
