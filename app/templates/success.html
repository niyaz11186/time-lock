<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Created</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; padding: 36px 16px 60px; }
    .box { background: #f0fdf4; border: 1px solid #86efac; padding: 20px 24px; border-radius: 6px; margin-top: 24px; }
    .link { word-break: break-all; font-family: monospace; font-size: 15px; color: #1d4ed8; }
    button { margin-top: 14px; padding: 8px 18px; cursor: pointer; background: #e5e7eb; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; }
    button:hover { background: #d1d5db; }
    a.back { display: inline-block; margin-top: 28px; color: #6b7280; text-decoration: none; font-size: 14px; }
    a.back:hover { text-decoration: underline; }
    nav.topbar { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; height: 54px; background: #1e293b; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
    .brand { font-size: 15px; font-weight: 700; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-links { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    .nav-links a { color: #cbd5e1; text-decoration: none; padding: 6px 10px; border-radius: 5px; font-weight: 500; }
    .nav-links a:hover { background: rgba(255,255,255,.1); color: #fff; }
    .user-badge { color: #94a3b8; font-size: 12px; padding: 4px 10px; background: rgba(255,255,255,.07); border-radius: 5px; margin-right: 4px; }
    .btn-logout { color: #f87171 !important; }
    .btn-logout:hover { background: rgba(248,113,113,.12) !important; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="brand">🔒 Time-Lock</a>
    <div class="nav-links">
      <span class="user-badge">{{ current_user.name }}</span>
      <a href="/">+ New</a>
      <a href="/my-secrets">My Secrets</a>
      <a href="/logout" class="btn-logout">Log out</a>
    </div>
  </nav>
  <div class="container">
  <h1>Secret Created!</h1>
  <p>Share this link with anyone you want to give access to your secret:</p>

  <div class="box">
    <div class="link" id="secret-link">{{ secret_url }}</div>
    <button onclick="navigator.clipboard.writeText('{{ secret_url }}').then(() => this.textContent = 'Copied!')">Copy link</button>
  </div>

  <a class="back" href="/">← Create another secret</a>
  </div>
</body>
</html>
