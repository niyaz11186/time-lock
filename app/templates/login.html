<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - TimeVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1628] min-h-screen font-sans">
  <nav class="bg-[#0e1628] border-b border-white/5 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 no-underline">
        <span class="flex items-center justify-center w-8 h-8 bg-indigo-600 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5l-9-4z"/>
          </svg>
        </span>
        <span class="text-white font-semibold tracking-tight text-sm">TimeVault</span>
      </a>
      <div class="flex items-center gap-1 text-sm">
        <a href="/login" class="text-white/90 px-4 py-1.5 rounded-md font-medium hover:bg-white/10 transition-colors no-underline">Log in</a>
        <a href="/signup" class="text-white/55 px-4 py-1.5 rounded-md font-medium hover:text-white hover:bg-white/10 transition-colors no-underline">Sign up</a>
      </div>
    </div>
  </nav>

  <div class="px-4 py-14 flex justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Welcome back</h1>
      <p class="text-sm text-gray-500 mb-6">Log in to your TimeVault account</p>

      {% if error %}
      <div class="bg-red-50 border border-red-300 text-red-700 text-sm rounded-xl px-4 py-3 mb-5">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" value="{{ request.form.get('email', '') }}" required
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
                 class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3 rounded-xl text-sm transition-colors">Log in</button>
      </form>

      <div class="flex items-center gap-3 my-5 text-xs text-gray-400">
        <span class="h-px bg-gray-200 flex-1"></span>
        <span>or</span>
        <span class="h-px bg-gray-200 flex-1"></span>
      </div>

      <a href="/auth/google/login" class="w-full border border-gray-200 rounded-xl py-3 text-sm text-gray-700 font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition no-underline">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </a>

      <p class="text-center text-sm text-gray-500 mt-5">Don't have an account? <a href="/signup" class="text-indigo-600 font-medium no-underline hover:underline">Sign up</a></p>
    </div>
  </div>
</body>
</html>
