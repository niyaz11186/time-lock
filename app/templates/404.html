<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - TimeVault</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1628] min-h-screen font-sans">
  <div class="min-h-screen px-4 flex items-center justify-center">
    <div class="w-full max-w-xl bg-white rounded-2xl shadow-2xl p-10 text-center">
      <div class="inline-flex items-center gap-2 mb-4">
        <span class="flex items-center justify-center w-10 h-10 bg-indigo-600 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1L3 5v6c0 5.25 3.75 10.15 9 11.35C17.25 21.15 21 16.25 21 11V5l-9-4z"/>
          </svg>
        </span>
        <span class="text-xl font-semibold tracking-tight text-gray-900">TimeVault</span>
      </div>
      <div class="text-6xl font-extrabold text-indigo-200 leading-none">404</div>
      <h1 class="text-2xl font-bold text-gray-900 mt-3">Secret Not Found</h1>
      <p class="text-sm text-gray-500 mt-2">The secret link you followed does not exist or may have been deleted.</p>
      <a href="/" class="inline-flex mt-6 px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition no-underline">Create a new secret</a>
    </div>
  </div>
</body>
</html>
